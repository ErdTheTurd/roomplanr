<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" role="img" aria-labelledby="lib-title lib-desc">
  <title id="lib-title">Plan Library window</title>
  <desc id="lib-desc">visionOS-style Plan Library showing Studio Apartment, 2-Bed Home, and Small Office sample plans with Import, Create, and Settings.</desc>
  <defs>
    <linearGradient id="libGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f5f7" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#e4e7ec" stop-opacity="0.94"/>
    </linearGradient>
    <filter id="libShadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1a1c1e" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Soft room backdrop hint -->
  <rect width="920" height="620" fill="#c8cdd4"/>
  <rect x="0" y="480" width="920" height="140" fill="#b5bbc4"/>
  <path d="M0 480 L280 360 H640 L920 480" fill="#d5d9df"/>

  <!-- Floating window -->
  <g filter="url(#libShadow)">
    <rect x="48" y="36" width="824" height="548" rx="28" fill="url(#libGlass)" stroke="#9aa3ae" stroke-width="1.25"/>
  </g>

  <!-- Window chrome -->
  <circle cx="78" cy="64" r="5.5" fill="#c45c4a"/>
  <circle cx="98" cy="64" r="5.5" fill="#c9a227"/>
  <circle cx="118" cy="64" r="5.5" fill="#5a9a6a"/>
  <text x="460" y="69" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#3a4048">Roomplanr</text>

  <!-- Toolbar -->
  <text x="78" y="118" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="600" fill="#1a1c1e">Plan Library</text>
  <g font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#1a1c1e">
    <rect x="620" y="96" width="72" height="28" rx="8" fill="#dfe3e8" stroke="#9aa3ae"/>
    <text x="656" y="114" text-anchor="middle">Import</text>
    <rect x="702" y="96" width="72" height="28" rx="8" fill="#dfe3e8" stroke="#9aa3ae"/>
    <text x="738" y="114" text-anchor="middle">Create</text>
    <rect x="784" y="96" width="72" height="28" rx="8" fill="#dfe3e8" stroke="#9aa3ae"/>
    <text x="820" y="114" text-anchor="middle">Settings</text>
  </g>

  <text x="78" y="148" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#5a6068">Browse sample designs or create your own, then walk through at full scale.</text>

  <!-- Honesty banner -->
  <rect x="78" y="164" width="764" height="34" rx="10" fill="#d9dde3" opacity="0.85"/>
  <circle cx="98" cy="181" r="7" fill="none" stroke="#5a6068" stroke-width="1.4"/>
  <text x="98" y="185" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="9" fill="#5a6068">i</text>
  <text x="114" y="186" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5a6068">Visualization only — dimensions are approximate, not survey-accurate.</text>

  <!-- Plan cards -->
  <!-- Studio -->
  <g>
    <rect x="78" y="220" width="236" height="300" rx="16" fill="#f7f8fa" stroke="#b8bec6"/>
    <rect x="94" y="236" width="204" height="128" rx="10" fill="#e8ecf0"/>
    <!-- Mini plan: studio -->
    <rect x="110" y="252" width="110" height="96" fill="#c5d5d2" stroke="#3d5c57" stroke-width="1.5"/>
    <rect x="220" y="252" width="48" height="46" fill="#c5d5d2" stroke="#3d5c57" stroke-width="1.5"/>
    <rect x="220" y="298" width="48" height="50" fill="#c5d5d2" stroke="#3d5c57" stroke-width="1.5"/>
    <text x="148" y="300" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="600" fill="#1a1c1e">Living / Sleep</text>
    <text x="244" y="278" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="8" fill="#1a1c1e">Kitchenette</text>
    <text x="244" y="326" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="8" fill="#1a1c1e">Bath</text>
    <text x="94" y="392" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#1a1c1e">Studio Apartment</text>
    <rect x="230" y="378" width="58" height="18" rx="9" fill="#e8a05a" fill-opacity="0.35"/>
    <text x="259" y="391" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="700" fill="#7a3d10">SAMPLE</text>
    <text x="94" y="416" font-family="SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#5a6068">≈ 6.0 × 5.0 m footprint</text>
    <text x="94" y="448" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6b727a">SAMPLE design — compact open living with kitchenette and bath. Approximate dimensions only.</text>
  </g>

  <!-- 2-Bed Home -->
  <g>
    <rect x="342" y="220" width="236" height="300" rx="16" fill="#f7f8fa" stroke="#b8bec6"/>
    <rect x="358" y="236" width="204" height="128" rx="10" fill="#e8ecf0"/>
    <rect x="372" y="250" width="88" height="54" fill="#c5d5d2" stroke="#3d5c57" stroke-width="1.4"/>
    <rect x="460" y="250" width="62" height="36" fill="#c5d5d2" stroke="#3d5c57" stroke-width="1.4"/>
    <rect x="460" y="286" width="62" height="30" fill="#c5d5d2" stroke="#3d5c57" stroke-width="1.4"/>
    <rect x="372" y="304" width="36" height="42" fill="#c5d5d2" stroke="#3d5c57" stroke-width="1.4"/>
    <rect x="408" y="304" width="72" height="42" fill="#c5d5d2" stroke="#3d5c57" stroke-width="1.4"/>
    <rect x="480" y="316" width="62" height="30" fill="#c5d5d2" stroke="#3d5c57" stroke-width="1.4"/>
    <text x="416" y="280" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="8" font-weight="600" fill="#1a1c1e">Living</text>
    <text x="358" y="392" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#1a1c1e">2-Bed Home</text>
    <rect x="494" y="378" width="58" height="18" rx="9" fill="#e8a05a" fill-opacity="0.35"/>
    <text x="523" y="391" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="700" fill="#7a3d10">SAMPLE</text>
    <text x="358" y="416" font-family="SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#5a6068">≈ 10.0 × 8.0 m footprint</text>
    <text x="358" y="448" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6b727a">SAMPLE design — living, kitchen, dining, hall, two bedrooms, and bath.</text>
  </g>

  <!-- Small Office -->
  <g>
    <rect x="606" y="220" width="236" height="300" rx="16" fill="#f7f8fa" stroke="#b8bec6"/>
    <rect x="622" y="236" width="204" height="128" rx="10" fill="#e8ecf0"/>
    <rect x="638" y="250" width="110" height="100" fill="#c5d5d2" stroke="#3d5c57" stroke-width="1.4"/>
    <rect x="748" y="250" width="52" height="58" fill="#c5d5d2" stroke="#3d5c57" stroke-width="1.4"/>
    <rect x="748" y="308" width="52" height="42" fill="#c5d5d2" stroke="#3d5c57" stroke-width="1.4"/>
    <text x="693" y="304" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="8" font-weight="600" fill="#1a1c1e">Open Workspace</text>
    <text x="774" y="282" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="8" fill="#1a1c1e">Meeting</text>
    <text x="774" y="332" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="8" fill="#1a1c1e">Utility</text>
    <text x="622" y="392" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#1a1c1e">Small Office</text>
    <rect x="758" y="378" width="58" height="18" rx="9" fill="#e8a05a" fill-opacity="0.35"/>
    <text x="787" y="391" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="700" fill="#7a3d10">SAMPLE</text>
    <text x="622" y="416" font-family="SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#5a6068">≈ 8.0 × 6.0 m footprint</text>
    <text x="622" y="448" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6b727a">SAMPLE design — open workspace, meeting room, and utility.</text>
  </g>
</svg>
